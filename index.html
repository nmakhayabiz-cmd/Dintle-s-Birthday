document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ter; gap: 12px; flex-wrap: wrap; margin-top: 16px\">\n                <a href=\"site.html\"><x-import component-from-global-scope=\"DintleSSpecialDayDesignSystem_bf17c3.Button\" tone=\"primary\" size=\"lg\" hint-size=\"auto,52px\">come inside<\u002Fx-import><\u002Fa>\n                <x-import component-from-global-scope=\"DintleSSpecialDayDesignSystem_bf17c3.Button\" tone=\"ghost\" size=\"lg\" sc-camel-on-click=\"{{ reset }}\" hint-size=\"auto,52px\">lock it again<\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;soundOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;showSpotOutlines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;petalPalette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pastel rainbow&quot;,&quot;all pink&quot;],&quot;default&quot;:&quot;pastel rainbow&quot;,&quot;tsType&quot;:&quot;'pastel rainbow' | 'all pink'&quot;,&quot;section&quot;:&quot;Locket&quot;}}\">\nconst KEY = 'dintle-vault-v1';\n\nconst ROUNDS = [\n  { kind: 'tray', eyebrow: 'round one · the coffee shop', q: 'She walks in. She is handed a menu. Build her order.',\n    note: 'One drink, one pastry, dragged onto the tray. She has never once deviated. Not once.' },\n  { kind: 'pick', eyebrow: 'round two · the name', q: 'What is she to the person who loves her THE most?',\n    note: 'He would like it noted that both are true at the same time.',\n    options: [\n      { label: 'ricecake', sub: 'no further questions', correct: true },\n      { label: 'dumpling', sub: 'close, but no' },\n      { label: 'small potato', sub: 'affectionate. wrong.' },\n      { label: 'sugarplum', sub: 'she would slap you' }\n    ] },\n  { kind: 'pick', eyebrow: 'round three · the birthmark', q: 'Her birthmark is shaped like a country. Which one?',\n    note: 'A place only a select few have ever been shown. Geography majors, now is your moment.',\n    options: [\n      { label: 'Australia', sub: 'the whole continent, dramatically', correct: true },\n      { label: 'Italy', sub: 'wrong boot' },\n      { label: 'Madagascar', sub: 'nice guess' },\n      { label: 'Sri Lanka', sub: 'too small, be serious' }\n    ] },\n  { kind: 'figure', eyebrow: 'round four · the location', q: 'Now show me exactly where Australia lives.',\n    note: 'Spin her around if you must. Tap the spot. No, it is not on her arm.',\n    targets: ['glute-r'] },\n  { kind: 'pick', eyebrow: 'round five · the peaches', q: 'Where did the peach obsession begin?',\n    note: 'This one is lore. Full-blown, six-years-old, criminal-record lore.',\n    options: [\n      { label: 'stealing gogo\\u2019s dried peaches at six', sub: 'from the drying tray, repeatedly', correct: true },\n      { label: 'a peach tree at her primary school' },\n      { label: 'a bad peach schnapps night' },\n      { label: 'she saw it in a music video' }\n    ] },\n  { kind: 'figure', eyebrow: 'round six · the fateful day', q: 'The peach heist left a scar. Where is it?',\n    note: 'Same crime, different evidence. Tap the exact spot.',\n    targets: ['thigh-l'] },\n  { kind: 'pick', eyebrow: 'round seven · the painting', q: 'In her painting, what animal did she paint?',\n    note: 'The artistic one. Framed, beloved, slightly slow-moving.',\n    options: [\n      { label: 'a sea turtle', sub: 'a whole ocean situation', correct: true },\n      { label: 'a koi fish' },\n      { label: 'a flamingo' },\n      { label: 'a hummingbird' }\n    ] },\n  { kind: 'pick', eyebrow: 'round eight · the finale', q: 'Last one. What makes Dintle special?',\n    note: 'Choose carefully. There is exactly one : 'upper back', x: 46, y: 54, w: 38, h: 23 },\n    { id: 'lower-back', label: 'lower back', x: 48, y: 78, w: 34, h: 19 },\n    { id: 'arm-l', label: 'her left arm', x: 29, y: 44, w: 15, h: 56 },\n    { id: 'arm-r', label: 'her right arm', x: 86, y: 44, w: 15, h: 56 },\n    { id: 'glute-l', label: 'left sitting-down spot', x: 45, y: 98, w: 20, h: 26 },\n    { id: 'glute-r', label: 'right sitting-down spot', x: 65, y: 98, w: 20, h: 26 },\n    { id: 'thigh-l', label: 'her left thigh', x: 47, y: 126, w: 17, h: 44 },\n    { id: 'thigh-r', label: 'her right thigh', x: 66, y: 126, w: 17, h: 44 },\n    { id: 'calf-l', label: 'her left calf', x: 47, y: 176, w: 17, h: 42 },\n    { id: 'calf-r', label: 'her right calf', x: 66, y: 176, w: 17, h: 42 }\n  ],\n  side: [\n    { id: 'profile', label: 'that profile', x: 50, y: 5, w: 30, h: 30 },\n    { id: 'ribs', label: 'ribs', x: 52, y: 46, w: 26, h: 32 },\n    { id: 'hip-side', label: 'hip', x: 50, y: 92, w: 30, h: 28 },\n    { id: 'thigh-side', label: 'outer thigh', x: 52, y: 124, w: 20, h: 45 },\n    { id: 'calf-side', label: 'calf', x: 52, y: 176, w: 20, h: 42 }\n  ]\n};\n\nconst NUDGE = [\n  'Not it. Try again, and this time think about her properly.',\n  'Absolutely not. The locket did not even flinch.',\n  'Bold guess. Wildly incorrect. Again.',\n  'No. Somewhere, she is disappointed in you.',\n  'Wrong, but confidently wrong. Go again.'\n];\nconst CHEER = [\n  'CORRECT. The locket heard you.',\n  'YES. One petal down, keep going.',\n  'Obviously. You know her.',\n  'Right again. Show-off.'\n];\n\nclass Component extends DCLogic {\n  state = { phase: 'intro', i: 0, unlocked: 0, fb: null, fbMsg: '', view: 'front', tray: { drink: null, pastry: null }, pick: null, photo: 0, hover: null, nudge: 0, cheer: 0, dragging: null };\n\n  componentDidMount() {\n    try {\n      const s = JSON.parse(localStorage.getItem(KEY) || 'null');\n      if (s && typeof s.unlocked === 'number') this.setState({ unlocked: s.unlocked, i: Math.min(s.i || 0, ROUNDS.length - 1), phase: s.phase === 'open' ? 'open' : 'intro' });\n    } catch (e) {}\n  }\n\n  save() {\n    try { localStorage.setItem(KEY, JSON.stringify({ unlocked: this.state.unlocked, i: this.state.i, phase: this.state.phase })); } catch (e) {}\n  }\n\n  tone(kind) {\n    if (this.props.soundOn === false) return;\n    try {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      if (!AC) return;\n      this.ac = this.ac || new AC();\n      const seq = kind === 'right' ? [660, 880] : kind === 'wrong' ? [300, 220] : kind === 'chime' ? [523, 659, 784, 1047] : [520];\n      seq.forEach((f, n) => {\n        const o = this.ac.createOscillator(), g = this.ac.createGain(), t = this.ac.currentTime + n * (kind === 'chime' ? 0.13 : 0.09);\n        o.type = kind === 'wrong' ? 'triangle' : 'sine';\n        o.frequency.value = f;\n        g.gain.setValueAtTime(0.0001, t);\n        g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);\n        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);\n        o.connect(g); g.connect(this.ac.destination); o.start(t); o.stop(t + 0.34);\n      });\n    } catch (e) {}\n  }\n\n  advance() {\n    const nextUnlocked = this.state.unlocked + 1;\n    const last = nextUnlocked >= ROUNDS.length;\n    this.setState({ unlocked: nextUnlocked, fb: 'right', fbMsg: CHEER[this.state.cheer % CHEER.length], cheer: this.state.cheer + 1 }, this.save);\n    this.tone(last ? 'chime' : 'right');\n    setTimeout(() => {\n      if (last) { this.setState({ phase: 'open', fb: null }, this.save); this.tone('chime'); }\n      else this.setState({ i: this.state.i + 1, fb: null, pick: null, tray: { drink: null, pastry: null }, view: 'front' }, this.save);\n    }, last ? 900 : 1050);\n  }\n\n  miss() {\n    this.setState({ fb: 'wrong', fbMsg: NUDGE[this.state.nudge % NUDGE.length], nudge: this.state.nudge + 1 });\n    this.tone('wrong');\n    setTimeout(() => this.setState({ fb: null, pick: null }), 1400);\n  }\n\n  answerPick = (opt) => {\n    if (this.state.fb) return;\n    this.setState({ pick: opt.label });\n    opt.correct ? this.advance() : this.miss();\n  };\n\n  place = (item, slot) => {\n    if (this.state.fb) return;\n    this.tone('click');\n    this.setState({ tray: { ...this.state.tray, [slot]: item } });\n  };\n\n  ringUp = () => {\n    const t = this.state.tray;\n    if (!t.drink || !t.pastry) return;\n    (t.drink.correct && t.pastry.correct) ? this.advance() : this.miss();\n  };\n\n  tapSpot = (spot) => {\n    if (this.state.fb) return;\n    ROUNDS[this.state.i].targets.indexOf(spot.id) >= 0 ? this.advance() : this.miss();\n  };\n\n  renderVals() {\n    const st = this.state, r = ROUNDS[st.i] || ROUNDS[0];\n    const petals = [];\n    for (let n = 0; n < 8; n++) {\n      const open = n < st.unlocked;\n      const tones = (this.props.petalPalette ?? 'pastel rainbow') === 'all pink'\n        ? ['--pink-300', '--pink-400', '--pink-300', '--pink-400', '--pink-300', '--pink-400', '--pink-300', '--pink-400']\n        : ['--pink-300', '--lilac-300', '--mint-300', '--butter-300', '--sky-300', '--peach-300', '--pink-400', '--lilac-500'];\n      petals.push({ style: {\n        position: 'absolute', width: '23%', height: '38%', top: '4%', left: '38.5%',\n        background: open ? `var(${tones[n]})` : 'var(--pink-200)',\n        border: '2px solid var(--pink-900)',\n        borderRadius: '50% 50% 50% 50% / 62% 62% 38% 38%',\n        transformOrigin: '50% 128%',\n        transform: `rotate(${n * 45}deg) translateY(${open ? '-14%' : '20%'}) scale(${open ? 1 : .86})`,\n        transition: 'transform .6s cubic-bezier(.34,1.56,.64,1), background .4s ease, opacity .4s ease',\n        opacity: open ? 1 : .92,\n        boxShadow: open ? '2px 3px 0 rgba(107,46,74,.25)' : 'none',\n        pointerEvents: 'none'\n      } });\n    }\n    const optBase = {\n      display: 'flex', flexDirection: 'column', gap: '4px', alignItems: 'flex-start', textAlign: 'left',\n      padding: '16px 18px', borderRadius: '18px', cursor: st.fb ? 'default' : 'pointer',\n      background: 'var(--paper)', color: 'var(--pink-900)', border: '2px solid var(--pink-900)',\n      boxShadow: '3px 4px 0 var(--pink-300)', font: 'inherit',\n      transition: 'transform .22s cubic-bezier(.34,1.56,.64,1), background .2s ease, box-shadow .2s ease'\n    };\n    const opts = (r.options || []).map(o => {\n      const chosen = st.pick === o.label;\n      const right = chosen && st.fb === 'right', wrong = chosen && st.fb === 'wrong';\n      return {\n        label: o.label, sub: o.sub || '',\n        onClick: () => this.answerPick(o),\n        style: {\n          ...optBase,\n          background: right ? 'var(--mint-300)' : wrong ? 'var(--peach-300)' : 'var(--paper)',\n          boxShadow: right ? '3px 4px 0 var(--mint-500)' : wrong ? '3px 4px 0 var(--peach-500)' : optBase.boxShadow,\n          transform: right ? 'translateY(-3px) scale(1.02)' : 'none',\n          animation: wrong ? 'dv-shake .4s ease' : 'none'\n        }\n      };\n    });\n\n    const chip = (item, slot) => ({\n      label: item.label, price: item.price,\n      onClick: () => this.place(item, slot),\n      onDragStart: () => this.setState({ dragging: { item, slot } }),\n      onDragEnd: () => this.setState({ dragging: null }),\n      style: {\n        display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px',\n        padding: '11px 14px', borderRadius: '999px', cursor: 'grab',\n        background: (st.tray[slot] && st.tray[slot].label === item.label) ? 'var(--pink-200)' : 'var(--paper)',\n        border: '2px solid var(--pink-900)', boxShadow: '2px 3px 0 var(--pink-300)',\n        fontFamily: \"'Quicksand', sans-serif\", fontWeight: 600, fontSize: '15px', color: 'var(--pink-900)',\n        userSelect: 'none', transition: 'transform .2s cubic-bezier(.34,1.56,.64,1)'\n      }\n    });\n    const slotStyle = (filled) => ({\n      minHeight: '74px', display: 'grid', placeItems: 'center', textAlign: 'center', padding: '10px',\n      borderRadius: '16px', border: filled ? '2px solid var(--pink-900)' : '2px dashed var(--pink-300)',\n      background: filled ? 'var(--butter-100)' : 'var(--pink-50)',\n      fontFamily: filled ? \"'Fredoka', sans-serif\" : \"'Quicksand', sans-serif\",\n      fontSize: filled ? '15px' : '14px', fontWeight: 600,\n      color: filled ? 'var(--pink-900)' : 'var(--ink-500)', lineHeight: 1.3\n    });\n\n    const views = ['front', 'back', 'side'].map(v => ({\n      label: v, onClick: () => { this.tone('click'); this.setState({ view: v }); },\n      style: {\n        padding: '9px 20px', borderRadius: '999px', cursor: 'pointer', font: 'inherit',\n        fontFamily: \"'Fredoka', sans-serif\", fontSize: '13px', letterSpacing: '.14em', textTransform: 'uppercase',\n        background: st.view === v ? 'var(--pink-600)' : 'var(--paper)',\n        color: st.view === v ? 'var(--paper)' : 'var(--pink-900)',\n        border: '2px solid var(--pink-900)', boxShadow: st.view === v ? 'none' : '2px 3px 0 var(--pink-300)'\n      }\n    }));\n    const spots = (HOT[st.view] || []).map(s => ({\n      label: s.label, onClick: () => { this.setState({ hover: s.label }); this.tapSpot(s); },\n      style: {\n        position: 'absolute', left: (s.x / 130 * 100) + '%', top: (s.y / 260 * 100) + '%',\n        width: (s.w / 130 * 100) + '%', height: (s.h / 260 * 100) + '%',\n        borderRadius: '40%', background: 'rgba(255,255,255,.14)',\n        border: (this.props.showSpotOutlines ?? true) ? '2px dotted rgba(107,46,74,.28)' : '2px dotted transparent',\n        cursor: 'pointer', padding: 0\n      }\n    }));\n\n    return {\n      isPick: r.kind === 'pick', isTray: r.kind === 'tray', isFigure: r.kind === 'figure',\n      opts,\n      drinks: DRINKS.map(d => chip(d, 'drink')), pastries: PASTRIES.map(d => chip(d, 'pastry')),\n      allowDrop: (e) => e.preventDefault(),\n      dropOnTray: (e) => { e.preventDefault(); if (st.dragging) this.place(st.dragging.item, st.dragging.slot); },\n      trayStyle: {\n        padding: '16px', borderRadius: '20px', background: 'var(--paper)',\n        border: '2px solid var(--pink-900)', boxShadow: '4px 5px 0 var(--pink-900)'\n      },\n      slotDrinkStyle: slotStyle(!!st.tray.drink), slotPastryStyle: slotStyle(!!st.tray.pastry),\n      trayDrink: st.tray.drink ? st.tray.drink.label : 'drag a drink here',\n      trayPastry: st.tray.pastry ? st.tray.pastry.label : 'drag a pastry here',\n      trayHint: (st.tray.drink && st.tray.pastry) ? 'That is the order. Ring it up.' : 'Drag, or just tap — the tray is not fussy.',\n      trayIncomplete: !(st.tray.drink && st.tray.pastry) || !!st.fb,\n      ringUpNow: this.ringUp,\n      views, viewFront: st.view === 'front', viewBack: st.view === 'back', viewSide: st.view === 'side',\n      spots, spotLabel: st.hover || 'pick a spot',\n      spotLabelStyle: {\n        position: 'absolute', left: '50%', bottom: '2%', transform: 'translateX(-50%)',\n        background: 'rgba(255,255,255,.86)', borderRadius: '999px', padding: '6px 14px',\n        fontFamily: \"'Fredoka', sans-serif\", fontSize: '12px', letterSpacing: '.12em', textTransform: 'uppercase',\n        color: 'var(--pink-800)', whiteSpace: 'nowrap', pointerEvents: 'none'\n      },\n      photos: [\n        { src: 'uploads/Screenshot_20251024_201712_WhatsApp_Original.jpg', caption: 'the smile in question', mat: 'var(--pink-300)', tilt: -4 },\n        { src: 'uploads/IMG-20251118-WA0026_Original.jpg', caption: 'exhibit b: unserious', mat: 'var(--mint-300)', tilt: 3 }\n      ].map((p, n) => {\n        const depth = (n - st.photo + 2) % 2;\n        return {\n          caption: p.caption,\n          style: {\n            position: 'absolute', inset: 0, background: p.mat, padding: '10px 10px 0',\n            border: '2px solid var(--paper)', borderRadius: '10px', boxShadow: '0 14px 30px rgba(107,46,74,.18)',\n            transform: `rotate(${depth === 0 ? p.tilt : p.tilt + 7}deg) translate(${depth * 14}px, ${depth * 10}px) scale(${depth === 0 ? 1 : .96})`,\n            zIndex: depth === 0 ? 2 : 1,\n            transition: 'transform .45s cubic-bezier(.34,1.56,.64,1)'\n          },\n          imgStyle: {\n            height: '78%', borderRadius: '4px',\n            background: `center/cover no-repeat url(${p.src})`\n          }\n        };\n      }),\n      flick: () => { this.tone('click'); this.setState({ photo: (st.photo + 1) % 2 }); },\n      hasFb: !!st.fb, fbMsg: st.fbMsg,\n      fbStyle: {\n        marginTop: '18px', padding: '14px 18px', borderRadius: '16px', textAlign: 'center',\n        fontFamily: \"'Lobster Two', cursive\", fontStyle: 'italic', fontWeight: 700, fontSize: '26px',\n        background: st.fb === 'right' ? 'var(--mint-100)' : 'var(--peach-100)',\n        border: '2px solid ' + (st.fb === 'right' ? 'var(--mint-500)' : 'var(--peach-500)'),\n        color: 'var(--pink-900)', animation: 'dv-pop .26s cubic-bezier(.34,1.56,.64,1)'\n      },\n      marqueeItems: ['access restricted', 'prove you know her', 'eight petals, eight questions', 'no hints', 'she knows'],\n      petals, heartSize: 86,\n      petalsLabel: st.unlocked + ' / 8 petals',\n      locketNote: st.phase === 'open' ? 'Fully open. As she should be.' : st.unlocked === 0 ? 'Eight petals, sealed shut. Answer something.' : 'It is opening. Do not stop now.',\n      isIntro: st.phase === 'intro', isPlaying: st.phase === 'playing', isOpen: st.phase === 'open',\n      hasProgress: st.unlocked > 0,\n      round: { eyebrow: r.eyebrow, q: r.q, note: r.note, counter: 'q' + (st.i + 1) + ' of 8' },\n      start: () => { this.tone('click'); this.setState({ phase: 'playing' }, this.save); },\n      reset: () => this.setState({ phase: 'intro', i: 0, unlocked: 0, pick: null, tray: { drink: null, pastry: null } }, this.save)\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
